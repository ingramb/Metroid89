<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Metroid 89</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; color: #ccc;
      font-family: -apple-system, system-ui, sans-serif;
      overflow: hidden; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #canvas {
      display: block; margin: 0 auto;
      width: 100vw; max-width: 880px; aspect-ratio: 8 / 5; height: auto;
      background: #000;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    #status { text-align: center; font-size: 14px; padding: 8px; }

    /* On-screen controls: hidden unless this is a touch device (set in JS). */
    #controls { display: none; }
    #controls .ctl, #joystick-zone {
      position: fixed; bottom: 0; z-index: 10; touch-action: none;
    }
    #joystick-zone { left: 0; width: 45vw; height: 45vw; max-width: 220px; max-height: 220px; }
    .joy-base {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 116px; height: 116px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.4);
    }
    .joy-knob {
      position: absolute; left: 50%; top: 50%; margin: -29px 0 0 -29px;
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(255,255,255,0.45);
    }

    .btn {
      position: fixed; z-index: 11;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.45);
      color: #fff; font-weight: 700; touch-action: none; user-select: none;
    }
    .btn.pressed { background: rgba(255,255,255,0.45); }
    .btn.big   { width: 84px;  height: 84px;  font-size: 15px; }
    .btn.small { width: 60px;  height: 60px;  font-size: 12px; }

    /* Right-hand action cluster. */
    #b-jump  { right: 24px;  bottom: 28px; }
    #b-shoot { right: 118px; bottom: 60px; }
    #b-miss  { right: 36px;  bottom: 124px; }
    /* Top utility buttons. */
    #b-beam  { right: 16px;  top: 16px; }
    #b-map   { right: 84px;  top: 16px; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="ver" style="position:fixed;top:0;right:0;z-index:99;font:11px monospace;color:#777;background:rgba(0,0,0,.5);padding:1px 4px;pointer-events:none;">build: ?</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="controls">
    <div id="joystick-zone"></div>
    <div class="btn big"   id="b-jump"  data-bit="64">JUMP</div>
    <div class="btn big"   id="b-shoot" data-bit="16">SHOOT</div>
    <div class="btn small" id="b-miss"  data-bit="1024">MISL</div>
    <div class="btn small" id="b-beam"  data-bit="512">BEAM</div>
    <div class="btn small" id="b-map"   data-bit="256">MAP</div>
  </div>

  <script>
    // --- Virtual-key bitmask shared with the C side (see port/main_sdl.c). ---
    // Bit values MUST match the TK_* enum there.
    var KEY = { UP:1, LEFT:2, DOWN:4, RIGHT:8, SHOOT:16, JUMP:64,
                MAP:0x100, BEAM:0x200, MISSILE:0x400 };
    var DIRS = KEY.UP | KEY.DOWN | KEY.LEFT | KEY.RIGHT;
    var touchBits = 0;
    var joyTouchId = null;   // DOM touch id of the finger driving the joystick
    function pushKeys() {
      if (typeof Module !== 'undefined' && Module._touch_set_keys) Module._touch_set_keys(touchBits);
    }

    // --- Emscripten Module (defined before the generated script loads, so the
    //     IDBFS preRun in wasm_pre.js can attach to Module.preRun). ---
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); },
      setStatus: function (t) { statusEl.textContent = t; if (t === '') statusEl.style.display = 'none'; },
      totalDependencies: 0,
      monitorRunDependencies: function (left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        this.setStatus(left ? 'Loading… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Running');
      }
    };
    Module.setStatus('Loading…');
    window.onerror = function () { Module.setStatus('Error — see console.'); };

    // --- Touch controls: only shown on touch ("coarse pointer") devices. ---
    function setupTouchControls() {
      if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) return;
      document.getElementById('controls').style.display = 'block';

      // Action buttons (pointer events cover touch + mouse).
      document.querySelectorAll('.btn').forEach(function (el) {
        var bit = parseInt(el.getAttribute('data-bit'), 10);
        var down = function (e) { e.preventDefault(); touchBits |= bit;  el.classList.add('pressed');    pushKeys(); };
        var up   = function (e) { e.preventDefault(); touchBits &= ~bit; el.classList.remove('pressed'); pushKeys(); };
        el.addEventListener('pointerdown', down);
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('pointerleave', up);
      });

      // --- Custom touch joystick. ---
      // We deliberately don't use a library here: nipplejs repeatedly dropped
      // its end/cancel events in multi-touch (steering + tapping a button),
      // leaving a direction latched ("wedged"). This tracks exactly one finger
      // by its DOM touch id, so set/clear is fully deterministic.
      var zone = document.getElementById('joystick-zone');
      var base = document.createElement('div'); base.className = 'joy-base';
      var knob = document.createElement('div'); knob.className = 'joy-knob';
      zone.appendChild(base); base.appendChild(knob);
      var cx = 0, cy = 0, radius = 58;

      function joyFind(e) {
        for (var i = 0; i < e.changedTouches.length; i++)
          if (e.changedTouches[i].identifier === joyTouchId) return e.changedTouches[i];
        return null;
      }
      function joyApply(t) {
        var dx = t.clientX - cx, dy = t.clientY - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var k = dist > radius ? radius / dist : 1;          // clamp knob to base
        knob.style.transform = 'translate(' + (dx * k) + 'px,' + (dy * k) + 'px)';
        var dz = radius * 0.35, bits = touchBits & ~DIRS;   // per-axis deadzone -> 8-way
        if (dx < -dz) bits |= KEY.LEFT;
        if (dx >  dz) bits |= KEY.RIGHT;
        if (dy < -dz) bits |= KEY.UP;
        if (dy >  dz) bits |= KEY.DOWN;
        touchBits = bits; pushKeys();
      }
      function joyReset() {
        joyTouchId = null;
        knob.style.transform = 'translate(0,0)';
        touchBits &= ~DIRS; pushKeys();
      }
      zone.addEventListener('touchstart', function (e) {
        if (joyTouchId !== null) return;                    // already tracking a finger
        e.preventDefault();
        var t = e.changedTouches[0];
        joyTouchId = t.identifier;
        var r = base.getBoundingClientRect();
        cx = r.left + r.width / 2; cy = r.top + r.height / 2; radius = r.width / 2;
        joyApply(t);
      }, { passive: false });
      zone.addEventListener('touchmove', function (e) {
        var t = joyFind(e); if (!t) return;
        e.preventDefault(); joyApply(t);
      }, { passive: false });

      function onTouchEndOrCancel(e) {
        if (joyTouchId !== null && joyFind(e)) joyReset();  // the joystick finger lifted
        if (e.touches.length === 0) {                       // nothing held -> reset everything
          touchBits = 0;
          document.querySelectorAll('.btn.pressed').forEach(function (el) { el.classList.remove('pressed'); });
          joyReset();
        }
      }
      document.addEventListener('touchend', onTouchEndOrCancel, { passive: true });
      document.addEventListener('touchcancel', onTouchEndOrCancel, { passive: true });
    }
    setupTouchControls();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
